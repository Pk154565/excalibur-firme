<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Firme consumazioni</title>
<!--
  Excalibur — pagina delle FIRME dei clienti (versione 2, 15/11/2026). Sta su GitHub Pages: qui NON ci sono dati,
  né indirizzi, né chiavi. Tutto quello che serve arriva dal link, dopo il # (che non viene mai mandato a GitHub):
    #<ID dello script>&c=<camera>&da=AAAA-MM-GG&a=AAAA-MM-GG&f=<timbro>
  La pagina chiede le firme allo script di Google con un POST di testo semplice e SENZA i cookie di Google:
  così Google non mette «/u/2/» nell'indirizzo (il difetto della versione 1 sui telefoni con più account).
  Il timbro lo controlla lo script: il link apre solo quella camera e quelle date.
-->
<style>
  :root { --sfondo:#f4f1ec; --carta:#fff; --testo:#2b2b2b; --tenue:#6b6b6b; --bordo:#ddd6cc; --arancio:#D4845A; --oliva:#7A8C5A; --errore:#a33; }
  @media (prefers-color-scheme: dark) {
    :root { --sfondo:#1d1c1a; --carta:#2a2926; --testo:#eee; --tenue:#aaa; --bordo:#45423d; --errore:#f88; }
    .firma img { background:#fff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--sfondo); color:var(--testo); font:17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  header { background:var(--arancio); color:#fff; padding:18px 16px 14px; }
  header h1 { margin:0; font-size:24px; }
  header p { margin:4px 0 0; font-size:16px; opacity:.95; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .firma { background:var(--carta); border:1px solid var(--bordo); border-radius:10px; padding:12px; margin-bottom:14px; }
  .info { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:16px; margin-bottom:8px; }
  .info b { color:var(--oliva); }
  .firma img { display:block; width:100%; height:auto; border:1px solid var(--bordo); border-radius:6px; }
  .messaggio { text-align:center; padding:36px 8px; color:var(--tenue); font-size:18px; }
  .errore { color:var(--errore); }
  .nota { font-size:14px; color:var(--tenue); text-align:center; margin-top:4px; }
  button { font:inherit; font-size:17px; padding:10px 18px; border-radius:8px; border:0; background:var(--oliva); color:#fff; margin-top:14px; }
</style>
</head>
<body>
<header>
  <h1 id="titolo">Firme consumazioni</h1>
  <p id="periodo"></p>
</header>
<main id="contenuto"><div class="messaggio">Carico le firme…</div></main>

<script>
"use strict";
function $(i) { return document.getElementById(i); }
function e(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
  return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); }
function dataIt(iso) { var p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }

// Il link: tutto dopo il #. Il primo pezzo è l'ID dello script (o, solo per le prove sul PC, un indirizzo locale).
function leggiLink() {
  var pezzi = (location.hash || "").replace(/^#/, "").split("&");
  var primo = decodeURIComponent(pezzi.shift() || "");
  var url = "";
  if (/^[A-Za-z0-9_-]{20,}$/.test(primo)) url = "https://script.google.com/macros/s/" + primo + "/exec";
  else if (/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/$/.test(primo)) url = primo;   // solo per le prove sul PC
  var p = {};
  pezzi.forEach(function (x) { var i = x.indexOf("="); if (i > 0) p[x.slice(0, i)] = decodeURIComponent(x.slice(i + 1)); });
  return { url: url, c: p.c || "", da: p.da || "", a: p.a || "", f: p.f || "" };
}

function mostra(html) { $("contenuto").innerHTML = html; }
function errore(testo) {
  mostra('<div class="messaggio errore">' + e(testo) + '</div>' +
         '<div class="messaggio" style="padding-top:0"><button id="riprova">Riprova</button></div>');
  $("riprova").onclick = carica;
}

var SPIEGA = {
  "link non valido": "Questo link non è valido. Inquadra di nuovo il QR dal gestionale.",
  "link incompleto": "Il link è incompleto. Inquadra di nuovo il QR dal gestionale.",
  "script non configurato": "La pagina delle firme non è ancora pronta (manca il segreto nello script). Avvisa chi gestisce il programma.",
  "foglio Ordini non trovato": "Non trovo il foglio degli ordini su Google. Avvisa chi gestisce il programma."
};

function carica() {
  var L = leggiLink();
  if (L.c) {
    $("titolo").textContent = "Firme — Camera " + L.c;
    if (/^\d{4}-\d{2}-\d{2}$/.test(L.da) && /^\d{4}-\d{2}-\d{2}$/.test(L.a)) $("periodo").textContent = dataIt(L.da) + " → " + dataIt(L.a);
  }
  if (!L.url || !L.c || !L.da || !L.a || !L.f) { errore(SPIEGA["link incompleto"]); return; }
  mostra('<div class="messaggio">Carico le firme…</div>');

  // Testo semplice e SENZA cookie: niente «/u/2/» di Google e niente domanda preventiva del browser.
  fetch(L.url, { method: "POST", body: JSON.stringify({ c: L.c, da: L.da, a: L.a, f: L.f }),
                 credentials: "omit", redirect: "follow", cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("Google ha risposto " + r.status); return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) { errore(SPIEGA[d && d.errore] || ("Errore: " + ((d && d.errore) || "risposta strana da Google"))); return; }
      var h = "";
      if (!d.firme.length) h = '<div class="messaggio">Nessuna firma per questa camera in questo periodo.</div>';
      d.firme.forEach(function (x) {
        if (!/^image\/(png|jpeg|gif|webp)$/.test(x.mime) || !/^[A-Za-z0-9+\/=]+$/.test(x.b64)) return;
        h += '<div class="firma"><div class="info"><span>' + e(x.quando) + '</span>' +
             (x.totale !== "" ? '<b>Totale € ' + e(x.totale) + '</b>' : '') + '</div>' +
             '<img alt="firma" src="data:' + x.mime + ';base64,' + x.b64 + '"></div>';
      });
      if (d.mancanti) h += '<p class="nota">' + d.mancanti + (d.mancanti === 1 ? ' firma non trovata' : ' firme non trovate') + ' su Google Drive.</p>';
      mostra(h);
    })
    .catch(function (x) {
      errore("Non riesco a raggiungere Google. Controlla la connessione e riprova." + (x && x.message ? " (" + x.message + ")" : ""));
    });
}

window.addEventListener("hashchange", carica);
carica();
</script>
</body>
</html>
